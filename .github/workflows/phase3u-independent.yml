name: Phase 3U independent Power.log probes

on:
  push:
    branches:
      - chatgpt/phase-3u-powerlog-independent
      - chatgpt/phase3u-show-entity-cardtype
  pull_request:
    branches:
      - claude/hearthstone-battlegrounds-ml-00rjn5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests-and-measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run independent Phase 3U Power.log tests
        run: >-
          python -m pytest -q
          tests/test_phase_3u_powerlog_feasibility.py
          tests/test_phase_3u_powerlog_state_recovery.py
          tests/test_phase_3u_powerlog_post_state.py
          tests/test_phase_3u_powerlog_play_membership.py
          tests/test_phase_3u_powerlog_entity_type.py
      - name: Require clean tracked and untracked repository state before measurement
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "repository is not clean before measurement" >&2
            exit 1
          fi
      - name: Verify frozen Power.log Git blob
        run: test "$(git hash-object Power.log)" = "b5df1f2955a9b439206066119c7d1bc27b05b80c"
      - name: Run source-grounded measurement probes
        run: |
          mkdir -p artifacts
          python -m ml.phase_3u_powerlog_feasibility --source Power.log --out artifacts/powerlog_feasibility.json
          python -m ml.phase_3u_powerlog_state_recovery --source Power.log --out artifacts/powerlog_state_recovery.json
          python -m ml.phase_3u_powerlog_post_state --source Power.log --out artifacts/powerlog_post_state.json
          python -m ml.phase_3u_powerlog_play_membership --source Power.log --out artifacts/powerlog_play_membership.json
          python -m ml.phase_3u_powerlog_entity_type --source Power.log --out artifacts/powerlog_entity_type.json
      - name: Validate Phase 3U measurement contract, fail-closed outputs, and provenance
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_COMMIT_KIND: ${{ github.event_name == 'pull_request' && 'pull_request_head' || 'execution' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('artifacts')
          reports = sorted(root.glob('powerlog_*.json'))
          if len(reports) != 5:
              raise SystemExit(f'expected 5 reports, found {len(reports)}')
          payloads = {p.name: json.loads(p.read_text(encoding='utf-8')) for p in reports}

          source_hashes = {v['source_sha256'] for v in payloads.values()}
          if len(source_hashes) != 1:
              raise SystemExit(f'source SHA disagreement: {source_hashes}')

          for name, payload in payloads.items():
              if payload.get('candidate_scoring_performed') is not False:
                  raise SystemExit(f'{name}: candidate_scoring_performed must remain false')
              if payload.get('ranking_ready') is not False:
                  raise SystemExit(f'{name}: ranking_ready must remain false')
              if payload.get('phase_3u_schema_ready') is not False:
                  raise SystemExit(f'{name}: phase_3u_schema_ready must remain false')
              if 'confirmation_seeds_consumed' in payload and payload['confirmation_seeds_consumed'] is not False:
                  raise SystemExit(f'{name}: confirmation_seeds_consumed must remain false')

          state = payloads['powerlog_state_recovery.json']
          expected_state = {
              'zone_changes': 247,
              'bracketed_zone_changes': 150,
              'numeric_zone_changes': 97,
              'zone_changes_with_recoverable_pre_state': 155,
              'bracketed_zone_changes_with_recoverable_pre_state': 150,
              'numeric_zone_changes_with_recoverable_pre_state': 5,
              'numeric_zone_changes_without_recoverable_pre_state': 92,
          }
          for key, expected in expected_state.items():
              if state.get(key) != expected:
                  raise SystemExit(f'state recovery mismatch {key}: {state.get(key)} != {expected}')

          post = payloads['powerlog_post_state.json']
          expected_post = {
              'unresolved_numeric_zone_events': 92,
              'post_zone_position_observed_before_next_zone': 16,
              'same_ordinal_position_conflicts': 0,
              'position_contradictions': 0,
          }
          for key, expected in expected_post.items():
              if post.get(key) != expected:
                  raise SystemExit(f'post-state mismatch {key}: {post.get(key)} != {expected}')
          play_post = post.get('by_zone', {}).get('PLAY', {})
          if play_post.get('unresolved') != 34 or play_post.get('union') != 7:
              raise SystemExit(f'PLAY post-state mismatch: {play_post}')

          membership = payloads['powerlog_play_membership.json']
          expected_membership = {
              'play_membership_intervals': 166,
              'identity_grounded': 142,
              'explicit_position_grounded': 111,
          }
          for key, expected in expected_membership.items():
              if membership.get(key) != expected:
                  raise SystemExit(f'PLAY membership mismatch {key}: {membership.get(key)} != {expected}')

          entity_type = payloads['powerlog_entity_type.json']
          expected_entity_type = {
              'play_membership_intervals': 166,
              'cardtype_grounded': 162,
              'explicit_minion_grounded': 33,
              'same_game_type_conflict_intervals': 0,
              'retrospective_cardtype_candidates': 0,
              'retrospective_explicit_minion_candidates': 0,
          }
          for key, expected in expected_entity_type.items():
              if entity_type.get(key) != expected:
                  raise SystemExit(f'entity-type mismatch {key}: {entity_type.get(key)} != {expected}')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          execution_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          source_commit = os.environ['SOURCE_COMMIT'].strip()
          if len(execution_commit) != 40 or len(source_commit) != 40:
              raise SystemExit('invalid execution/source commit provenance')

          manifest = {
              'execution_commit': execution_commit,
              'source_commit': source_commit,
              'source_commit_kind': os.environ['SOURCE_COMMIT_KIND'],
              'event_name': os.environ['EVENT_NAME'],
              'working_tree_clean_before_measurement': True,
              'powerlog_git_blob': subprocess.check_output(['git', 'hash-object', 'Power.log'], text=True).strip(),
              'powerlog_source_sha256': next(iter(source_hashes)),
              'phase3u_measurement_contract_asserted': True,
              'probe_outputs': {p.name: sha256(p) for p in reports},
              'reserved_confirmation_seeds_consumed': False,
              'candidate_scoring_performed': False,
              'ranking_ready': False,
              'phase_3u_schema_ready': False,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload immutable measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3u-independent-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
