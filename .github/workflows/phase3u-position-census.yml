name: Phase 3U position census

on:
  push:
    branches:
      - chatgpt/phase3u-position-order-census
  pull_request:

jobs:
  position-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Focused tests
        run: python -m pytest tests/test_phase_3u_powerlog_play_membership.py tests/test_phase_3u_powerlog_entity_type.py tests/test_phase_3u_powerlog_position_census.py -q
      - name: Verify clean tracked and untracked tree
        run: |
          test -z "$(git status --porcelain)"
      - name: Verify frozen Power.log blob and run census
        run: |
          test "$(git hash-object Power.log)" = "b5df1f2955a9b439206066119c7d1bc27b05b80c"
          python -m ml.phase_3u_powerlog_position_census --source Power.log --out phase3u-position-census.json
      - name: Fail-closed scientific flags
        run: |
          python - <<'PY'
          import json
          p=json.load(open('phase3u-position-census.json'))
          assert p['play_membership_intervals'] == 166
          assert p['cardtype_grounded'] == 162
          assert p['explicit_minion_grounded'] == 33
          assert p['board_set_reconstructed'] is False
          assert p['board_order_reconstructed'] is False
          assert p['phase_3u_schema_ready'] is False
          assert p['ranking_ready'] is False
          assert p['candidate_scoring_performed'] is False
          assert p['confirmation_seeds_consumed'] is False
          print(json.dumps({k:v for k,v in p.items() if k != 'per_game'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3u-position-census-${{ github.sha }}
          path: phase3u-position-census.json
